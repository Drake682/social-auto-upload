services:
  postgres:
    image: postgres:16-alpine
    container_name: socialflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-socialflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-socialflow_dev}
      POSTGRES_DB: ${DB_NAME:-socialflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-socialflow} -d ${DB_NAME:-socialflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: socialflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-socialflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-socialflow_minio_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: socialflow-minio-createbucket
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-socialflow-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-socialflow_minio_dev}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-socialflow} ${S3_SECRET_KEY:-socialflow_minio_dev} &&
      mc mb --ignore-existing local/${S3_BUCKET:-socialflow-media} &&
      mc anonymous set none local/${S3_BUCKET:-socialflow-media}
      "

  nestjs_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialflow-nestjs-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-socialflow}
      DB_PASSWORD: ${DB_PASSWORD:-socialflow_dev}
      DB_NAME: ${DB_NAME:-socialflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_key_change_in_production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_prod}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AI_WORKER_URL: ${AI_WORKER_URL:-http://fastapi_worker:8001}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-socialflow-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-socialflow_minio_dev}
      S3_FORCE_PATH_STYLE: "true"
    command: npm run start:dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  fastapi_worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: socialflow-fastapi-worker
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-socialflow}
      DB_PASSWORD: ${DB_PASSWORD:-socialflow_dev}
      DB_NAME: ${DB_NAME:-socialflow}
      DATABASE_URL: postgresql://${DB_USER:-socialflow}:${DB_PASSWORD:-socialflow_dev}@postgres:5432/${DB_NAME:-socialflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      TREND_INTERVAL_MINUTES: ${TREND_INTERVAL_MINUTES:-120}
      SCRAPER_TIMEOUT_SECONDS: ${SCRAPER_TIMEOUT_SECONDS:-15}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      TIKTOK_API_URL: ${TIKTOK_API_URL:-}
      TIKTOK_API_HOST: ${TIKTOK_API_HOST:-}
      FACEBOOK_API_URL: ${FACEBOOK_API_URL:-}
      FACEBOOK_API_HOST: ${FACEBOOK_API_HOST:-}
      FACEBOOK_TREND_QUERY: ${FACEBOOK_TREND_QUERY:-viral}
      STOCK_VIDEO_PATH: /app/assets/stock_background.mp4
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-vi-VN-HoaiMyNeural}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-socialflow-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-socialflow_minio_dev}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10

  flask_uploader:
    build:
      context: .
      dockerfile: Dockerfile.flask
    container_name: socialflow-flask-uploader
    restart: unless-stopped
    environment:
      FLASK_PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-socialflow}
      DB_PASSWORD: ${DB_PASSWORD:-socialflow_dev}
      DB_NAME: ${DB_NAME:-socialflow}
      DATABASE_URL: postgresql://${DB_USER:-socialflow}:${DB_PASSWORD:-socialflow_dev}@postgres:5432/${DB_NAME:-socialflow}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev_encryption_key_change_in_prod}
      FB_HEADLESS: ${FB_HEADLESS:-1}
      FB_UPLOAD_TIMEOUT_MS: ${FB_UPLOAD_TIMEOUT_MS:-300000}
      FB_ACTION_TIMEOUT_MS: ${FB_ACTION_TIMEOUT_MS:-30000}
      TIKTOK_HEADLESS: ${TIKTOK_HEADLESS:-1}
      TIKTOK_UPLOAD_TIMEOUT_MS: ${TIKTOK_UPLOAD_TIMEOUT_MS:-300000}
      TIKTOK_ACTION_TIMEOUT_MS: ${TIKTOK_ACTION_TIMEOUT_MS:-30000}
      SHOPEE_HEADLESS: ${SHOPEE_HEADLESS:-1}
      SHOPEE_UPLOAD_TIMEOUT_MS: ${SHOPEE_UPLOAD_TIMEOUT_MS:-300000}
      SHOPEE_ACTION_TIMEOUT_MS: ${SHOPEE_ACTION_TIMEOUT_MS:-30000}
      SHOPEE_UPLOAD_URL: ${SHOPEE_UPLOAD_URL:-https://creator.shopee.vn/}
      ERROR_LOGS_DIR: /app/error_logs
      BROWSER_LOCALE: ${BROWSER_LOCALE:-vi-VN}
      BROWSER_TIMEZONE_ID: ${BROWSER_TIMEZONE_ID:-Asia/Ho_Chi_Minh}
      BROWSER_PROFILE_ROOT: /app/cookiesFile
      BROWSER_USER_AGENT: ${BROWSER_USER_AGENT:-}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-socialflow-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-socialflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-socialflow_minio_dev}
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "5000:5000"
    volumes:
      - flask_error_logs:/app/error_logs
      - flask_video_files:/app/videoFile
      - flask_cookie_files:/app/cookiesFile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
  flask_error_logs:
  flask_video_files:
  flask_cookie_files:

networks:
  default:
    name: socialflow-network
